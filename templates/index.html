<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>I2C Device Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .device { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .hidden { display: none; }

        /* Popover styles */
        #popover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #popover-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 90%;
        }
        #popover-content h2 {
            margin-top: 0;
            font-size: 1.5em;
        }
        #popover-content label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #popover-content input, #popover-content textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        #popover-content textarea {
            height: 100px;
            resize: vertical;
        }
        #popover-content button {
            margin-top: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #popover-content .save {
            background-color: #4CAF50;
            color: white;
        }
        #popover-content .cancel {
            background-color: #f44336;
            color: white;
            margin-left: 10px;
        }
        #popover-content button:hover {
            opacity: 0.9;
        }
        .interface-code-container {
            position: relative;
            margin-top: 5px;
        }
        #ai_code_button {
            background-color: #2196F3;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        #save_code_button {
            background-color: #FFC107;
            color: black;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        #loading_indicator {
            color: #666;
            margin-top: 5px;
        }
        #error_message {
            margin-top: 5px;
            color: red;
        }
    </style>
</head>
<body>
    <h1>I2C Device Manager</h1>
    
    <h2>Active Devices</h2>
    <div id="active-devices"></div>
    
    <h2>New Devices</h2>
    <div id="new-devices"></div>
    
    <h2>Archived Devices</h2>
    <div id="archived-devices"></div>

    <!-- Popover container -->
    <div id="popover" class="hidden">
        <div id="popover-content">
            <!-- Configuration form will be inserted here -->
        </div>
    </div>

    <script>
        const socket = io();
        let config = { connections: [], new_connections: [], archived_connections: [] };
        let prevConfig = { connections: [], new_connections: [], archived_connections: [] };
        let pendingDataEvents = [];

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('config_update', (data) => {
            console.log('Received config_update:', data);
            updateUI(data);
            prevConfig = JSON.parse(JSON.stringify(config));
            config = data;
            processPendingDataEvents();
        });

        socket.on('device_data', (data) => {
            console.log('Received device_data:', data);
            const deviceDiv = document.getElementById(`device-${data.address}`);
            if (!deviceDiv) {
                console.warn(`No device div found for address ${data.address}, queuing event`);
                pendingDataEvents.push(data);
                return;
            }
            handleDeviceData(data);
        });

        function processPendingDataEvents() {
            const remainingEvents = [];
            pendingDataEvents.forEach(data => {
                const deviceDiv = document.getElementById(`device-${data.address}`);
                if (deviceDiv) {
                    handleDeviceData(data);
                } else {
                    remainingEvents.push(data);
                }
            });
            pendingDataEvents = remainingEvents;
        }

        function handleDeviceData(data) {
            const deviceDiv = document.getElementById(`device-${data.address}`);
            const textElements = deviceDiv.querySelectorAll('.data-text');
            if (textElements.length === 0) {
                console.warn(`No text elements found for device ${data.address}`);
                return;
            }
            if (!data.data || typeof data.data !== 'object') {
                console.warn(`Invalid data structure for device ${data.address}:`, data.data);
                return;
            }
            const validKeys = getValidDataKeys(data.address);
            textElements.forEach(el => {
                if (el.dataset.key && validKeys.includes(el.dataset.key)) {
                    const value = data.data[el.dataset.key];
                    el.value = value !== undefined && value !== null ? value : 'N/A';
                    console.log(`Setting ${el.dataset.key} to ${el.value} for device ${data.address}`);
                } else {
                    console.warn(`Invalid or unknown data_key ${el.dataset.key} for device ${data.address}`);
                }
            });
        }

        function getValidDataKeys(address) {
            const conn = config.connections.find(c => c.address === address);
            if (!conn || !conn.ui_components) return [];
            return conn.ui_components
                .filter(ui => ui.type === 'text' && ui.data_key)
                .map(ui => ui.data_key);
        }

        function deepEqual(obj1, obj2) {
            if (obj1 === obj2) return true;
            if (typeof obj1 !== 'object' || typeof obj2 !== 'object' || obj1 == null || obj2 == null) return false;
            let keys1 = Object.keys(obj1);
            let keys2 = Object.keys(obj2);
            if (keys1.length !== keys2.length) return false;
            for (let key of keys1) {
                if (!keys2.includes(key) || !deepEqual(obj1[key], obj2[key])) return false;
            }
            return true;
        }

        function updateUI(newConfig) {
            const activeDiv = document.getElementById('active-devices');
            const newDiv = document.getElementById('new-devices');
            const archivedDiv = document.getElementById('archived-devices');
            
            activeDiv.innerHTML = '';
            newDiv.innerHTML = '';
            archivedDiv.innerHTML = '';

            config.connections.forEach(conn => {
                const div = createDeviceDiv(conn, true);
                activeDiv.appendChild(div);
            });

            config.new_connections.forEach(conn => {
                const div = createDeviceDiv(conn, false);
                newDiv.appendChild(div);
            });

            config.archived_connections.forEach(conn => {
                const div = createDeviceDiv(conn, false);
                archivedDiv.appendChild(div);
            });
        }

        function createDeviceDiv(conn, isActive) {
            const div = document.createElement('div');
            div.className = 'device';
            div.id = `device-${conn.address}`;
            div.innerHTML = `<h3>${conn.name} (${conn.address})</h3>`;
            
            if (isActive && conn.ui_components) {
                conn.ui_components.forEach(ui => {
                    if (ui.type === 'text') {
                        div.innerHTML += `${ui.label}: <input type="text" class="data-text" data-key="${ui.data_key}" readonly><br>`;
                    } else if (ui.type === 'slider') {
                        div.innerHTML += `${ui.label}: <input type="range" min="${ui.min}" max="${ui.max}" data-channel="${ui.channel}"><br>`;
                        const slider = div.querySelector(`input[data-channel="${ui.channel}"]`);
                        slider.oninput = () => {
                            socket.emit('write_device', {
                                address: conn.address,
                                value: parseInt(slider.value),
                                channel: parseInt(ui.channel)
                            });
                        };
                    }
                });
            }

            const configBtn = document.createElement('button');
            configBtn.textContent = 'Configure';
            configBtn.onclick = () => showConfigForm(conn);
            div.appendChild(configBtn);

            return div;
        }

        function showConfigForm(conn) {
            const popover = document.getElementById('popover');
            const popoverContent = document.getElementById('popover-content');
            popoverContent.innerHTML = `
                <h2>Configure Device</h2>
                <p>Address: ${conn.address}</p>
                <label>Name: <input type="text" id="name" value="${conn.name}"></label>
                <label>Interface Module: <input type="text" id="interface_module" value="${conn.interface_module || ''}"></label>
                <label>Interface Class: <input type="text" id="interface_class" value="${conn.interface_class || ''}"></label>
                <label>UI Components (JSON): <textarea id="ui_components">${JSON.stringify(conn.ui_components || [], null, 2)}</textarea></label>
                <label>Interface Code:
                    <div class="interface-code-container">
                        <textarea id="interface_code_textarea" rows="10" cols="50"></textarea>
                        <button id="ai_code_button" style="display: none;">AI Code</button>
                        <button id="save_code_button">Save Code</button>
                        <div id="loading_indicator" style="display: none;">Loading...</div>
                        <div id="error_message" style="display: none;"></div>
                    </div>
                </label>
                <button type="button" class="save" onclick="saveConfig('${conn.address}')">Save Configuration</button>
                <button type="button" class="cancel" onclick="closePopover()">Cancel</button>
            `;
            popover.classList.remove('hidden');

            // Set up event listeners
            const interfaceCodeTextarea = document.getElementById('interface_code_textarea');
            const aiCodeButton = document.getElementById('ai_code_button');
            const saveCodeButton = document.getElementById('save_code_button');
            const loadingIndicator = document.getElementById('loading_indicator');
            const errorMessage = document.getElementById('error_message');

            interfaceCodeTextarea.addEventListener('input', () => {
                if (interfaceCodeTextarea.value.trim() === '') {
                    aiCodeButton.style.display = 'inline-block';
                } else {
                    aiCodeButton.style.display = 'none';
                }
            });

            aiCodeButton.addEventListener('click', () => {
                const deviceName = document.getElementById('name').value;
                if (!deviceName) {
                    errorMessage.textContent = 'Please provide a device name.';
                    errorMessage.style.display = 'block';
                    return;
                }
                aiCodeButton.disabled = true;
                loadingIndicator.style.display = 'block';
                errorMessage.style.display = 'none';

                fetch('/get_base_py')
                    .then(response => response.text())
                    .then(basePyCode => {
                        fetch('/generate_interface_code', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ base_py: basePyCode, device_name: deviceName })
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (document.getElementById('interface_code_textarea')) {
                                interfaceCodeTextarea.value = data.code;
                                aiCodeButton.style.display = 'none';
                            }
                        })
                        .catch(error => {
                            errorMessage.textContent = 'Error generating code: ' + error.message;
                            errorMessage.style.display = 'block';
                        })
                        .finally(() => {
                            aiCodeButton.disabled = false;
                            loadingIndicator.style.display = 'none';
                        });
                    })
                    .catch(error => {
                        errorMessage.textContent = 'Error fetching base.py: ' + error.message;
                        errorMessage.style.display = 'block';
                        aiCodeButton.disabled = false;
                        loadingIndicator.style.display = 'none';
                    });
            });

            saveCodeButton.addEventListener('click', () => {
                const interfaceModule = document.getElementById('interface_module').value;
                const interfaceCode = document.getElementById('interface_code_textarea').value;
                if (!interfaceModule) {
                    errorMessage.textContent = 'Please provide an interface module name.';
                    errorMessage.style.display = 'block';
                    return;
                }
                fetch('/save_interface_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ module_name: interfaceModule, code: interfaceCode })
                })
                .then(response => {
                    if (response.ok) {
                        alert('Code saved successfully');
                    } else {
                        alert('Failed to save code');
                    }
                })
                .catch(error => {
                    errorMessage.textContent = 'Error saving code: ' + error.message;
                    errorMessage.style.display = 'block';
                });
            });

            if (interfaceCodeTextarea.value.trim() === '') {
                aiCodeButton.style.display = 'inline-block';
            } else {
                aiCodeButton.style.display = 'none';
            }
        }

        function closePopover() {
            const popover = document.getElementById('popover');
            popover.classList.add('hidden');
        }

        function saveConfig(address) {
            const name = document.getElementById('name').value;
            const interface_module = document.getElementById('interface_module').value;
            const interface_class = document.getElementById('interface_class').value;
            let ui_components;
            try {
                ui_components = JSON.parse(document.getElementById('ui_components').value || '[]');
            } catch (e) {
                alert('Invalid JSON in UI Components');
                return;
            }

            const updatedConn = {
                address: address,
                name: name,
                interface_module: interface_module,
                interface_class: interface_class,
                ui_components: ui_components,
                active: config.connections.some(c => c.address === address) ? 1 : 0
            };

            let section = 'connections';
            if (config.new_connections.some(c => c.address === address)) {
                section = 'new_connections';
                updatedConn.active = 1;
            } else if (config.archived_connections.some(c => c.address === address)) {
                section = 'archived_connections';
            }

            const index = config[section].findIndex(c => c.address === address);
            if (index !== -1) {
                config[section][index] = updatedConn;
                if (section === 'new_connections') {
                    config.connections.push(updatedConn);
                    config.new_connections.splice(index, 1);
                } else if (section === 'archived_connections') {
                    config.archived_connections.splice(index, 1);
                    if (updatedConn.active) {
                        config.connections.push(updatedConn);
                    } else {
                        config.archived_connections.push(updatedConn);
                    }
                }
            } else {
                config.connections.push(updatedConn);
            }

            socket.emit('update_config', config);
            closePopover();
        }
    </script>
</body>
</html>
