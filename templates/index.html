<body>
    <h1>I2C Device Manager</h1>

    <div class="section">
        <h2>Active Devices</h2>
        <div id="active-devices"></div>
    </div>

    <div class="section">
        <h2>New Devices</h2>
        <div id="new-devices"></div>
    </div>

    <div class="section">
        <h2>Archived Devices</h2>
        <div id="archived-devices"></div>
    </div>

    <script>
        const socket = io();
        let config = {};
        let prevConfig = {};

        function deepEqual(obj1, obj2) {
            if (obj1 === obj2) return true;
            if (typeof obj1 !== 'object' || typeof obj2 !== 'object' || obj1 == null || obj2 == null) return false;
            let keys1 = Object.keys(obj1), keys2 = Object.keys(obj2);
            if (keys1.length !== keys2.length) return false;
            for (let key of keys1) {
                if (!keys2.includes(key) || !deepEqual(obj1[key], obj2[key])) return false;
            }
            return true;
        }

        function updateUI(newConfig) {
            if (deepEqual(newConfig, config)) {
                console.log('Configuration unchanged, skipping UI update');
                return;
            }
            console.log('Configuration changed, updating UI');

            updateSection('active-devices', newConfig.connections.filter(conn => conn.active), true);
            updateSection('new-devices', newConfig.new_connections);
            updateSection('archived-devices', newConfig.archived_connections);
        }

        function updateSection(sectionId, connections, isActiveSection = false) {
            const sectionDiv = document.getElementById(sectionId);
            sectionDiv.innerHTML = '';
            connections.forEach(conn => {
                console.log(`Placing device ${conn.address} (${conn.name}) in ${isActiveSection ? 'Active' : sectionId === 'new-devices' ? 'New' : 'Archived'} Devices, active: ${conn.active}`);
                sectionDiv.appendChild(createDeviceDiv(conn, isActiveSection));
            });
        }

        function createDeviceDiv(conn, isActive) {
            const div = document.createElement('div');
            div.className = 'device';
            div.id = `device-${conn.address}`;
            let html = `<h3>${conn.name} (${conn.address})</h3>`;
            
            if (isActive && conn.ui_components) {
                conn.ui_components.forEach(ui => {
                    if (ui.type === 'text') {
                        html += `${ui.label}: <input type="text" class="data-text" data-key="${ui.data_key}" readonly><br>`;
                    } else if (ui.type === 'slider') {
                        html += `${ui.label}: <input type="range" min="${ui.min}" max="${ui.max}" data-channel="${ui.channel}"><br>`;
                    }
                });
            }

            div.innerHTML = html;

            if (isActive && conn.ui_components) {
                conn.ui_components.forEach(ui => {
                    if (ui.type === 'slider') {
                        const slider = div.querySelector(`input[data-channel="${ui.channel}"]`);
                        slider.addEventListener('input', () => {
                            socket.emit('write_device', {
                                address: conn.address,
                                value: parseInt(slider.value),
                                channel: parseInt(ui.channel)
                            });
                        });
                    }
                });
            }

            const configBtn = document.createElement('button');
            configBtn.textContent = 'Configure';
            configBtn.onclick = () => showConfigForm(conn);
            div.appendChild(configBtn);

            return div;
        }

        function showConfigForm(conn) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';

            const form = document.createElement('div');
            form.className = 'config-form';
            form.innerHTML = `
                <h2>Configure Device</h2>
                <p>Address: ${conn.address}</p>
                <label>Name: <input type="text" id="name" value="${conn.name}"></label>
                <label>Interface Module:
                    <select id="interface_module" onchange="loadInterfaceCode(this.value)">
                        <option value="">Select Module</option>
                    </select>
                </label>
                <label>Interface Class: <input type="text" id="interface_class" value="${conn.interface_class || ''}"></label>
                <label>UI Components (JSON): <textarea id="ui_components">${JSON.stringify(conn.ui_components || [], null, 2)}</textarea></label>
                <label>Interface Code:
                    <div class="interface-code-container">
                        <textarea id="interface_code_textarea" rows="10" cols="50"></textarea>
                        <button id="ai_code_button" style="display: none;">AI Code</button>
                        <button id="save_code_button">Save Code</button>
                        <div id="loading_indicator" style="display: none;">Loading...</div>
                        <div id="error_message" style="display: none;"></div>
                    </div>
                </label>
                <button class="save" onclick="saveConfig('${conn.address}')">Save Configuration</button>
                <button class="cancel" onclick="closeConfigForm()">Cancel</button>
            `;
            
            document.body.appendChild(overlay);
            document.body.appendChild(form);

            socket.emit('list_interfaces');

            const interfaceCodeTextarea = document.getElementById('interface_code_textarea');
            const aiCodeButton = document.getElementById('ai_code_button');
            const saveCodeButton = document.getElementById('save_code_button');
            const loadingIndicator = document.getElementById('loading_indicator');
            const errorMessage = document.getElementById('error_message');

            interfaceCodeTextarea.addEventListener('input', () => {
                aiCodeButton.style.display = interfaceCodeTextarea.value.trim() === '' ? 'inline-block' : 'none';
            });

            aiCodeButton.addEventListener('click', () => {
                const deviceName = document.getElementById('name').value;
                if (!deviceName) {
                    errorMessage.textContent = 'Please provide a device name.';
                    errorMessage.style.display = 'block';
                    return;
                }
                aiCodeButton.disabled = true;
                loadingIndicator.style.display = 'block';
                errorMessage.style.display = 'none';

                fetch('/get_base_py')
                    .then(response => response.text())
                    .then(basePyCode => {
                        fetch('/generate_interface_code', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ base_py: basePyCode, device_name: deviceName })
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (document.getElementById('interface_code_textarea')) {
                                interfaceCodeTextarea.value = data.code;
                                aiCodeButton.style.display = 'none';
                            }
                        })
                        .catch(error => {
                            errorMessage.textContent = 'Error generating code: ' + error.message;
                            errorMessage.style.display = 'block';
                        })
                        .finally(() => {
                            aiCodeButton.disabled = false;
                            loadingIndicator.style.display = 'none';
                        });
                    })
                    .catch(error => {
                        errorMessage.textContent = 'Error fetching base.py: ' + error.message;
                        errorMessage.style.display = 'block';
                        aiCodeButton.disabled = false;
                        loadingIndicator.style.display = 'none';
                    });
            });

            saveCodeButton.addEventListener('click', () => {
                const interfaceModule = document.getElementById('interface_module').value;
                const interfaceCode = document.getElementById('interface_code_textarea').value;
                if (!interfaceModule) {
                    errorMessage.textContent = 'Please select an interface module.';
                    errorMessage.style.display = 'block';
                    return;
                }
                socket.emit('save_interface_code', {
                    module_name: interfaceModule,
                    code: interfaceCode
                });
            });

            if (interfaceCodeTextarea.value.trim() === '') {
                aiCodeButton.style.display = 'inline-block';
            }

            if (conn.interface_module) {
                socket.emit('get_interface_code', conn.interface_module);
            }
        }

        function loadInterfaceCode(moduleName) {
            if (moduleName) {
                socket.emit('get_interface_code', moduleName);
            } else {
                document.getElementById('interface_code_textarea').value = '';
                document.getElementById('ai_code_button').style.display = 'inline-block';
            }
        }

        function closeConfigForm() {
            const form = document.querySelector('.config-form');
            const overlay = document.querySelector('.overlay');
            if (form) form.remove();
            if (overlay) overlay.remove();
        }

        function saveConfig(address) {
            let ui_components;
            try {
                ui_components = JSON.parse(document.getElementById('ui_components').value || '[]');
            } catch (e) {
                alert('Invalid JSON in UI Components');
                return;
            }

            const updatedConn = {
                address: address,
                name: document.getElementById('name').value,
                interface_module: document.getElementById('interface_module').value,
                interface_class: document.getElementById('interface_class').value,
                ui_components: ui_components,
                active: config.connections.some(c => c.address === address && c.active) ? 1 : 0
            };

            let section = 'connections';
            if (config.new_connections.some(c => c.address === address)) {
                section = 'new_connections';
                updatedConn.active = 1;
            } else if (config.archived_connections.some(c => c.address === address)) {
                section = 'archived_connections';
            }

            const index = config[section].findIndex(c => c.address === address);
            if (index !== -1) {
                config[section][index] = updatedConn;
                if (section === 'new_connections' && updatedConn.interface_module && updatedConn.interface_class) {
                    config.connections.push(updatedConn);
                    config.new_connections.splice(index, 1);
                }
            } else {
                config.connections.push(updatedConn);
            }

            socket.emit('update_config', config);
            closeConfigForm();
        }

        socket.on('config_update', (data) => {
            console.log('Received config_update:', data);
            updateUI(data);
            prevConfig = JSON.parse(JSON.stringify(config));
            config = data;
        });

        socket.on('device_data', (data) => {
            console.log('Received device_data:', data);
            const deviceDiv = document.getElementById(`device-${data.address}`);
            if (!deviceDiv) {
                console.warn(`No device div found for address ${data.address}`);
                return;
            }
            const textElements = deviceDiv.querySelectorAll('.data-text');
            textElements.forEach(el => {
                if (el.dataset.key && data.data.hasOwnProperty(el.dataset.key)) {
                    el.value = data.data[el.dataset.key];
                }
            });
        });

        socket.on('interface_list', (interfaces) => {
            const select = document.getElementById('interface_module');
            if (select) {
                select.innerHTML = '<option value="">Select Module</option>';
                interfaces.forEach(module => {
                    const option = document.createElement('option');
                    option.value = module;
                    option.textContent = module;
                    select.appendChild(option);
                });
                if (config.connections.find(c => c.address === select.closest('.config-form').querySelector('p').textContent.split(': ')[1])?.interface_module) {
                    select.value = config.connections.find(c => c.address === select.closest('.config-form').querySelector('p').textContent.split(': ')[1]).interface_module;
                }
            }
        });

        socket.on('interface_code', (data) => {
            if (data.error) {
                console.error(data.error);
                return;
            }
            const textarea = document.getElementById('interface_code_textarea');
            if (textarea) {
                textarea.value = data.code;
                document.getElementById('ai_code_button').style.display = data.code.trim() === '' ? 'inline-block' : 'none';
            }
        });

        socket.on('save_status', (data) => {
            if (data.status === 'success') {
                alert(`Interface ${data.module_name} saved successfully`);
            } else {
                alert(`Error saving interface: ${data.error}`);
            }
        });
    </script>
</body>
</html>
